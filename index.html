html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: SEO Afghanistan red-and-white logbook. White header with the logo and a red rule; a red welcome band; one working column of cards; each task opens as a dossier with a vertical hand-off chain. */
:root{
  --brand:#E31E24; --brand-deep:#B5151A; --brand-ink:#FFFFFF; --brand-soft:#FDECEC; --brand-line:#F6C9CA;
  --bg:#F6F6F7; --surface:#FFFFFF; --sunk:#F0F0F2; --line:#E3E3E7; --ink:#1B1B1F; --muted:#6A6A73;
  --ok:#17804C; --ok-soft:#E3F3EA; --warn:#A86200; --warn-soft:#FBF0DC; --idle:#6A6A73; --idle-soft:#EDEDF0;
  --f-ui:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --r-s:6px;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 4px 14px rgba(20,20,30,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#FF4D52; --brand-deep:#E31E24; --brand-ink:#FFFFFF; --brand-soft:#3A1618; --brand-line:#5A2224;
  --bg:#131316; --surface:#1C1C20; --sunk:#17171A; --line:#2D2D33; --ink:#EDEDF0; --muted:#A0A0AA;
  --ok:#5BC98E; --ok-soft:#173127; --warn:#E7B25C; --warn-soft:#3A2C14; --idle:#A0A0AA; --idle-soft:#26262C;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#FF4D52; --brand-deep:#E31E24; --brand-ink:#FFFFFF; --brand-soft:#3A1618; --brand-line:#5A2224;
  --bg:#131316; --surface:#1C1C20; --sunk:#17171A; --line:#2D2D33; --ink:#EDEDF0; --muted:#A0A0AA;
  --ok:#5BC98E; --ok-soft:#173127; --warn:#E7B25C; --warn-soft:#3A2C14; --idle:#A0A0AA; --idle-soft:#26262C;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--brand)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:start}
.brand img{height:42px;width:auto;display:block}
.brand .logo-w{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo-r{display:none}:root:not([data-theme="light"]) .brand .logo-w{display:block}}
:root[data-theme="dark"] .brand .logo-r{display:none} :root[data-theme="dark"] .brand .logo-w{display:block}
.brand .bt{display:grid;line-height:1.25}
.brand .bt b{font-size:17px;font-weight:800}
.brand .bt small{font-size:12px;color:var(--muted)}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--idle-soft);color:var(--idle);white-space:nowrap;line-height:1.7}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--brand-soft);color:var(--brand)} .pill.acc{background:var(--brand-soft);color:var(--brand)}
.pill.plain::before{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep);color:var(--brand-ink)}
.btn.white{background:#fff;border-color:#fff;color:#B5151A}
.btn.outline-w{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--brand)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{padding-block:22px 64px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.crumbs button{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font-size:13px;font-weight:500}
h1,h2,h3{font-weight:800;text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.sec{display:grid;gap:12px;margin-top:28px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{display:flex;align-items:center;gap:8px}
.sec-h h2 svg{color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;cursor:pointer;text-align:start;min-width:0;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card:hover{border-color:var(--brand-line)}
.card .t{font-weight:700;font-size:16px}
.card.project{border-top:4px solid var(--brand)}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.ref{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.03em;direction:ltr;unicode-bidi:isolate}
/* hero */

.hero{background:linear-gradient(135deg,#EE2B31 0%,#C8161C 55%,#8A0E13 100%);color:#fff;border-radius:16px;padding:34px 30px;display:grid;gap:14px;position:relative;overflow:hidden;box-shadow:0 18px 40px -20px rgba(180,20,26,.6)}
.hero::before{content:"";position:absolute;width:460px;height:460px;border-radius:50%;inset-inline-start:-160px;bottom:-300px;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);pointer-events:none}
.hero.split{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;gap:30px}
@media (max-width:820px){.hero.split{grid-template-columns:1fr}}
.hero-main{display:grid;gap:14px;position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;justify-self:start;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
.eyebrow svg{width:15px;height:15px}
.hero-side{position:relative;z-index:1}
.art{background:#fff;color:#1A1A1F;border-radius:14px;padding:16px;display:grid;box-shadow:0 22px 44px -14px rgba(60,0,0,.5);transform:rotate(-1.5deg)}
[dir="rtl"] .art,[dir="rtl"] .hero-photo{transform:rotate(1.5deg)}
.art .sub{color:#6B6B76;font-size:12.5px;line-height:1.4}
.art-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.art-bar{height:6px;border-radius:9px;background:#F6E3E4;overflow:hidden;margin-bottom:12px}
.art-bar span{display:block;height:100%;background:#E31E24;border-radius:9px}
.art-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #EFEFF2;border-radius:10px;background:#fff}
.art-link{width:2px;height:12px;background:#EBC0C2;margin-inline-start:27px}
.art .pill{background:#EEEEF1;color:#6B6B76}.art .pill.ok{background:#E3F4EA;color:#1E7A46}.art .pill.warn{background:#FBF0DC;color:#94620E}
.art .av{background:#FDE7E8;color:#C8161C}
.hero-photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:5px solid rgba(255,255,255,.92);box-shadow:0 22px 44px -14px rgba(60,0,0,.55);transform:rotate(-1.5deg)}
@media (max-width:820px){.hero-side{max-width:440px}}
@media (max-width:560px){.hero-side[aria-hidden="true"]{display:none}}
.hx{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:440px;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 30px 60px -42px rgba(20,20,30,.45)}
.hx-text{position:relative;z-index:2;display:grid;gap:18px;align-content:center;padding:48px 44px}

.hx .eyebrow{background:var(--brand-soft);color:var(--brand);border:0;font-weight:700}
.hx h1{font-size:44px;line-height:1.12;letter-spacing:-.025em;color:var(--ink);max-width:16ch}
[lang="fa"] .hx h1,[dir="rtl"] .hx h1{letter-spacing:0;line-height:1.35}
.hx h1 em{font-style:normal;color:var(--brand);display:block}
.hx p{color:var(--muted);font-size:16.5px;margin:0;max-width:50ch;line-height:1.75}
.hx .btn{padding:11px 18px;border-radius:10px;font-size:15px}
.hx .btn.white{background:var(--brand);border-color:var(--brand);color:#fff}
.hx .btn.white:hover{background:var(--brand-deep)}
.hx .btn.outline-w{background:var(--surface);border-color:var(--line);color:var(--ink)}
.hx-media{position:relative;min-height:100%}
.hx-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
[dir="rtl"] .hx-media img{}
.chip{position:absolute;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);color:#1A1A1F;box-shadow:0 12px 32px -12px rgba(0,0,0,.4);font-size:13px;line-height:1.35;border:1px solid rgba(255,255,255,.7)}
.chip .sub{color:#62626C;font-size:12px}
.chip .av{width:32px;height:32px;font-size:12px;background:#FDE7E8;color:#C8161C}
.chip.bottom{inset-inline-end:24px;bottom:24px}
.chip.top{inset-inline-end:24px;top:24px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:12.5px}
.chip .tick{width:22px;height:22px;border-radius:50%;background:#1E9E5A;color:#fff;display:grid;place-items:center;flex:none}
.chip .tick svg{width:13px;height:13px;stroke-width:3}
.pulse{width:8px;height:8px;border-radius:50%;background:#E31E24;box-shadow:0 0 0 0 rgba(227,30,36,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(227,30,36,0)}100%{box-shadow:0 0 0 0 rgba(227,30,36,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
@media (max-width:860px){.hx{grid-template-columns:1fr;min-height:0}.hx-media{order:-1;height:260px}.hx-media img,[dir="rtl"] .hx-media img{}.hx-text{padding:6px 22px 30px}.hx-text::before{display:none}.hx h1{font-size:32px}.chip.bottom{bottom:auto;top:200px;display:none}}
.greet.banner{position:relative;display:block;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 30px;min-height:180px;overflow:hidden;box-shadow:0 24px 50px -40px rgba(20,20,30,.45)}

.greet.banner .bn-txt{position:relative;z-index:1;max-width:58%;display:grid;gap:16px;justify-items:start}
.greet.banner .bn-img{position:absolute;inset-block:0;inset-inline-end:0;width:46%;height:100%;object-fit:cover;}
[dir="rtl"] .greet.banner .bn-img{}
@media (max-width:700px){.greet.banner{padding:0 0 22px}.greet.banner .bn-img,[dir="rtl"] .greet.banner .bn-img{position:relative;display:block;width:100%;height:170px;}.greet.banner .bn-txt{max-width:none;padding:0 20px}.greet.banner{display:flex;flex-direction:column-reverse}}
.teamband{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px;background:linear-gradient(135deg,#FFF4F4,#FDE3E4);border:1px solid #F6D3D5;border-radius:16px;overflow:hidden;padding:0 0 0 26px;min-height:200px;color:#1A1A1F}
[dir="rtl"] .teamband{padding:0 26px 0 0}
.teamband .tb-text{align-self:center;padding-block:24px;display:grid;gap:8px}
.teamband h1{color:#1A1A1F} .teamband .sub{color:#5E5E68;max-width:60ch} .teamband label.fl{color:#1A1A1F}
.teamband img{display:block;height:230px;width:auto;mix-blend-mode:multiply;}
@media (max-width:700px){.teamband,[dir="rtl"] .teamband{grid-template-columns:1fr;padding:0}.teamband .tb-text{padding:22px 20px 0}.teamband img{height:auto;width:100%;max-width:420px;justify-self:center}}
.hero::after{content:"";position:absolute;inset-block:0;inset-inline-end:-40px;width:300px;background:repeating-linear-gradient(-60deg,rgba(255,255,255,.07) 0 14px,transparent 14px 28px);pointer-events:none}
.hero h1{font-size:30px;color:#fff;max-width:22ch}
.hero p{margin:0;max-width:60ch;opacity:.95}
.hero .row{position:relative;z-index:1}
.steps{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;box-shadow:var(--shadow)}
.step .ic{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.step .ic svg{width:22px;height:22px}
.step{position:relative;transition:transform .15s ease,box-shadow .15s ease}
.step:hover,.role:hover{transform:translateY(-2px);box-shadow:0 12px 26px -14px rgba(20,20,30,.3)}
.step .n{position:absolute;top:10px;inset-inline-end:16px;font-size:34px;font-weight:800;line-height:1;color:var(--brand-soft);font-variant-numeric:tabular-nums}
.step h3,.step .sub{position:relative}
.roles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.roles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.roles.three{grid-template-columns:1fr}}
.role{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow)}
.role{position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease}
.role::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--line)}
.role.main::before{background:var(--brand)} .role.team::before{background:var(--ok)}
.role.main{border:2px solid var(--brand)}
.role .ic.soft{background:var(--ok-soft);color:var(--ok)}
.who{display:grid;gap:12px}
.who .w{display:flex;gap:12px;align-items:flex-start}
.who .w .ic{width:36px;height:36px;flex:none}
.who .w .ic svg{width:18px;height:18px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;line-height:1}
.role .ic{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.role .ic.alt{background:var(--sunk);color:var(--ink)}
.role .ic svg{width:22px;height:22px}
/* greeting + stats */
.greet{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:2px}
.stat .n{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:13px;color:var(--muted)}
.stat.hot .n{color:var(--brand)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.av.lg{width:46px;height:46px;font-size:17px}
.feed{display:grid}
.ev{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:start;padding-block:12px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .what{min-width:0}
.ev .when{font-size:12px;color:var(--muted);white-space:nowrap}
.ev button.lnk{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font-weight:600;text-align:start}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:10px 18px;overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs button[aria-selected="true"] svg{color:var(--brand)}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:30px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center;background:var(--surface)}
.empty .ic{width:52px;height:52px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.empty .ic svg{width:26px;height:26px}
.empty b{color:var(--ink);font-size:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--sunk)}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;box-shadow:var(--shadow)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.num{font-variant-numeric:tabular-nums}
.phead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:12px;box-shadow:var(--shadow);border-top:4px solid var(--brand)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--brand);border-radius:4px}
/* hand-off chain */
.chain{display:grid}
.stage{display:grid;grid-template-columns:46px 1fr;gap:14px;position:relative;padding-bottom:20px}
.stage::before{content:"";position:absolute;inset-inline-start:22px;top:50px;bottom:4px;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.stage .who-col{display:grid;justify-items:center;gap:4px}
.stage .idx{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.stage.done .av{background:var(--ok-soft);color:var(--ok)} .stage.returned .av{background:var(--brand);color:#fff} .stage.waiting .av{background:var(--idle-soft);color:var(--idle)}
.stage .body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0;box-shadow:var(--shadow)}
.stage.returned .body{border-color:var(--brand-line)}
.handoff{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.handoff .who{color:var(--ink);font-weight:800;font-size:16px}
.handoff .kind{background:var(--sunk);border-radius:var(--r-s);padding:1px 8px;color:var(--ink);font-weight:600}
.flow{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.flow b{color:var(--ink)}
.flow svg{width:16px;height:16px;color:var(--brand)}
html[dir="rtl"] .flow svg.dir{transform:scaleX(-1)}
html[dir="rtl"] svg.dir{transform:scaleX(-1)}
.report{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.translated{border-inline-start:3px solid var(--brand-line);padding-inline-start:12px;color:var(--muted);white-space:pre-wrap;font-size:14px}
.subs{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.subs li{display:flex;gap:8px;align-items:flex-start}
.subs .box{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;flex:none;margin-top:4px;display:grid;place-items:center}
.subs .box.on{background:var(--ok);border-color:var(--ok);color:#fff}
.subs .box svg{width:12px;height:12px;stroke-width:3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);border-radius:var(--r-s);padding:3px 9px;background:var(--sunk);overflow-wrap:anywhere;text-decoration:none;color:var(--ink)}
.chip svg{width:14px;height:14px}
/* forms */
form.f{display:grid;gap:14px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
label.fl{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--ink)}
label.fl .req{color:var(--brand)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-s);padding:9px 11px;font-weight:400;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;background:var(--surface)}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--muted);font-weight:400}
details.more{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
details.more summary{cursor:pointer;font-weight:700;color:var(--brand)}
details.more[open] summary{margin-bottom:12px}
details.more .stack{gap:12px}
.overlay{position:fixed;inset:0;background:rgba(15,15,20,.45);z-index:20;display:grid;place-items:start center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:var(--r);width:min(720px,100%);display:grid;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dialog .dh{background:var(--brand);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dialog .dh h2{color:#fff;font-size:18px}
.dialog .dh button{background:none;border:0;color:#fff;cursor:pointer;padding:4px}
.dialog .db{padding:18px}
.toast{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-s);font-size:14px;max-width:calc(100% - 32px);font-weight:600}
.note{font-size:13px;padding:10px 14px;border-radius:var(--r-s);background:var(--warn-soft);color:var(--warn)}
.demo-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-s);padding:10px 14px;font-weight:600;margin-bottom:16px}
.log{display:grid;grid-template-columns:110px 1fr;gap:14px;padding-block:14px;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:0}
.log .d{font-size:13px;color:var(--muted);font-weight:600}
@media (max-width:560px){.log{grid-template-columns:1fr;gap:4px}h1{font-size:22px}.hero h1{font-size:24px}.hero{padding:22px 18px}.brand .bt small{display:none}.ev{grid-template-columns:36px 1fr}.ev .when{grid-column:2}}
.back svg{transform:scaleX(-1)} html[dir="rtl"] .back svg{transform:none}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:border-color .15s,background .15s,color .15s}}
</style>

let fbAuth=null;
function boot(){
  applyLang();
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey){st.loaded=true;st.authReady=true;st.nosetup=true;render();return}
  firebase.initializeApp(cfg);fbAuth=firebase.auth();st.db=firebase.firestore();
  fbAuth.onAuthStateChanged(async u=>{
    stopAll();st.authUser=u;st.authReady=true;st.me={id:null,owner:false,admin:false,canWrite:null,role:null};st.readOnly=false;
    if(!u){st.loaded=true;render();return}
    st.me.id=u.uid;st.loaded=false;render();
    try{const ref=st.db.collection("users").doc(u.uid);let snap=await ref.get();
      if(!snap.exists){await ref.set({name:u.displayName||"",email:u.email||"",role:"pending",createdAt:new Date().toISOString()});snap=await ref.get()}
      const ud=snap.data()||{};st.me.name=ud.name||"";st.me.inTeam=!!ud.inTeam;const role=ud.role||"pending";st.me.role=role;st.me.admin=role==="admin";st.me.owner=role==="admin";
      st.readOnly=!(role==="pm"||role==="admin");st.me.canWrite=!st.readOnly;
      if(role==="pending"||role==="disabled"){st.loaded=true;render();return}
      startData();
    }catch(e){st.loaded=true;st.err=e&&e.code;render()}
  });
}
function stopAll(){if(subs.pm){subs.pm();subs.pm=null}Object.values(subs.proj).forEach(f=>f&&f());subs.proj={};if(subs.tasks){subs.tasks();subs.tasks=null}if(subs.logs){subs.logs();subs.logs=null}if(subs.users){subs.users();subs.users=null}if(subs.team){subs.team();subs.team=null}st.team={};st.all=null;
  st.pms={};st.projects={};st.tasks={};st.logs={};st.users={};st.curProj=null;st.view={name:"home"}}
function startData(){const db=st.db;
  const timer=setTimeout(()=>{if(!st.loaded){st.slow=true;render()}},10000);
  subs.pm=db.collection("pm").onSnapshot(snap=>{
    const next={};snap.docs.forEach(d=>{next[d.id]=d.data()});st.pms=next;
    Object.keys(next).forEach(watchProjects);
    st.loaded=true;st.slow=false;clearTimeout(timer);render();
  },err=>{st.loaded=true;clearTimeout(timer);render()});
  subs.team=db.collection("team").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());st.team=m;render()},()=>{});
  if(st.me.admin)subs.users=db.collection("users").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());st.users=m;render()},()=>{});
}

/* ---------- navigation ---------- */
function go(v){st.view=v;st.confirm=null;
  if(!st.demo){
    if(v.pid&&(st.curProj!==v.uid+"/"+v.pid)){st.curProj=v.uid+"/"+v.pid;openProjectSubs(v.uid,v.pid)}
    if(!v.pid&&st.curProj){st.curProj=null;if(subs.tasks){subs.tasks();subs.tasks=null}if(subs.logs){subs.logs();subs.logs=null}}
  }
  render();window.scrollTo(0,0)}

/* ---------- helpers ---------- */
const pmName=uid=>{const p=st.pms[uid]||{};return p.name||"—"};
const stageKind=s=>s.kindCustom||s.kind||"–";
function projectStats(tasks){const arr=Object.values(tasks||{});let stages=0,active=0,done=0,hours=0,overdue=0;const td=today();
  arr.forEach(x=>{if(x.status==="done")done++;else if(x.due&&x.due<td)overdue++;(x.stages||[]).forEach(s=>{stages++;if(s.status==="in_progress")active++;hours+=Number(s.hours)||0})});
  return{tasks:arr.length,done,stages,active,hours,overdue}}
function crumbs(parts){return `<nav class="crumbs">${parts.map((p,i)=>i<parts.length-1?`<button type="button" data-act="${p.act}" ${p.data||""}>${esc(p.label)}</button><span aria-hidden="true">›</span>`:`<span>${esc(p.label)}</span>`).join("")}</nav>`}
const transSrc={};
function trBtn(key,text){if(!st.sample||!text||st.demo)return"";/* translate is not available outside claude.ai */const tr=st.trans[key];
  return `<div class="row"><button class="btn small ghost" type="button" data-act="translate" data-key="${esc(key)}">${ic("globe")}${tr&&tr.busy?t("translating"):(tr&&tr.text?t("hideTr"):t("translate"))}</button></div>${tr&&tr.text?`<div class="translated" lang="${tr.to}" dir="${tr.to==="fa"?"rtl":"ltr"}">${esc(tr.text)}</div>`:""}`}
function totals(uids){let a=0,o=0,s=0,l=0;uids.forEach(u=>Object.values(st.projects[u]||{}).forEach(p=>{const m=p.summary||{};if(p.status!=="done")a++;o+=(m.tasks||0)-(m.done||0);s+=m.active||0;l+=m.overdue||0}));return{a,o,s,l}}
function statTiles(x){return `<div class="stats"><div class="stat"><span class="n">${fmtNum(x.a)}</span><span class="l">${esc(t("stActive"))}</span></div><div class="stat"><span class="n">${fmtNum(x.o)}</span><span class="l">${esc(t("stOpen"))}</span></div><div class="stat"><span class="n">${fmtNum(x.s)}</span><span class="l">${esc(t("stStages"))}</span></div><div class="stat ${x.l?"hot":""}"><span class="n">${fmtNum(x.l)}</span><span class="l">${esc(t("stLate"))}</span></div></div>`}
function feed(uids){const ev=[];uids.forEach(u=>Object.entries(st.projects[u]||{}).forEach(([pid,p])=>{(p.events||[]).forEach(e=>ev.push(Object.assign({uid:u,pid,pname:p.name},e)))}));
  ev.sort((a,b)=>String(b.at).localeCompare(a.at));const top=ev.slice(0,10);
  if(!top.length)return `<div class="panel sub">${esc(t("noActivity"))}</div>`;
  return `<div class="panel feed">${top.map(e=>`<div class="ev">${av(e.who||pmName(e.uid))}<div class="what"><b>${esc(e.who||pmName(e.uid))}</b> ${esc(t({stage:"evStage",task:"evTask",note:"evNote",project:"evProject"}[e.k]||"evStage"))}${e.text?`: <span>${esc(e.text)}</span>`:""}<div class="sub"><button class="lnk" type="button" data-act="openProject" data-uid="${esc(e.uid)}" data-pid="${esc(e.pid)}">${esc(e.pname||"")}</button>${uids.length>1?` · ${esc(pmName(e.uid))}`:""}</div></div><span class="when">${esc(ago(e.at))}</span></div>`).join("")}</div>`}

/* ---------- render ---------- */
function render(){updateRole();
  if(st.nosetup&&!st.demo){app.innerHTML=landing(null)+`<div class="note" style="margin-top:16px"><b>${esc(t("setupT"))}</b> ${esc(t("setupS"))}</div>`;return}
  if(!st.authReady){app.innerHTML=`<div class="empty"><span class="ic">${ic("book")}</span><b>${esc(t("loading"))}</b></div>`;return}
  if(!st.authUser&&!st.demo){app.innerHTML=signInPage();return}
  if(!st.demo&&st.me.role==="pending"){app.innerHTML=welcomePage();return}
  if(!st.demo&&st.me.role==="disabled"){app.innerHTML=`<section class="hero"><h1>${esc(t("roles.disabled"))}</h1></section>`;return}
  if(!st.loaded&&!st.nodb){app.innerHTML=`<div class="empty"><span class="ic">${ic("book")}</span><b>${esc(t("loading"))}</b>${st.slow?`<div class="note">${esc(t("slow"))}</div>`:""}</div>`;return}
  if(st.nodb&&!st.demo){app.innerHTML=landing(false)+`<div class="note" style="margin-top:16px">${esc(t("nodb"))}</div>`;return}
  const v=st.view;let h=st.demo?`<div class="demo-banner"><span>${ic("eye")} ${esc(t("demoBanner"))}</span><button class="btn small" type="button" data-act="endDemo">${esc(t("demoBack"))}</button></div>`:"";
  if(v.name==="users"&&st.me.admin)h+=usersPage();
  else if(v.name==="team")h+=teamPage();
  else if(v.name==="home")h+=home();
  else if(v.name==="pm")h+=pmPage(v.uid);
  else if(v.name==="project")h+=projectPage(v.uid,v.pid);
  else if(v.name==="task")h+=taskPage(v.uid,v.pid,v.tid);
  app.innerHTML=h}

function heroArt(){if(st.photo)return `<div class="hero-side"><img class="hero-photo" src="team.jpg" alt="${esc(t("teamPhoto"))}"></div>`;
  const rows=[["artP1","artS1","ok","artDone"],["artP2","artS2","warn","artDoing"],["artP3","artS3","","artNext"]];
  return `<div class="hero-side" aria-hidden="true"><div class="art"><div class="art-h"><div><b>${esc(t("artTask"))}</b><div class="sub">${esc(t("artClient"))}</div></div><span class="pill warn">${esc(t("artNow"))}</span></div><div class="art-bar"><span style="width:45%"></span></div>${rows.map(([p,s2,c,l],i)=>`<div class="art-row">${av(t(p))}<div class="grow" style="min-width:0"><b style="font-size:14px">${esc(t(s2))}</b><div class="sub">${esc(t(p))}</div></div><span class="pill ${c}">${esc(t(l))}</span></div>${i<2?'<div class="art-link"></div>':""}`).join("")}</div></div>`}
function heroBlock(title,text,btns,img,em){if(img)return `<section class="hx"><div class="hx-text"><span class="eyebrow">${ic("book")}${esc(t("eyebrow"))}</span><h1>${esc(title)}${em?`<em>${esc(em)}</em>`:""}</h1><p>${esc(text)}</p>${btns?`<div class="row">${btns}</div>`:""}</div><div class="hx-media"><img src="${img}" alt="${esc(t("teamPhoto"))}"><span class="chip top"><span class="pulse"></span>${esc(t("liveRep"))}</span><div class="chip bottom">${av(t("artP2"))}<div><b>${esc(t("artS2"))}</b><div class="sub">${esc(t("artP2"))} → ${esc(t("artP3"))}</div></div><span class="tick">${ic("check")}</span></div></div></section>`;return `<section class="hero split"><div class="hero-main"><span class="eyebrow">${ic("book")}${esc(t("eyebrow"))}</span><h1>${esc(title)}</h1><p>${esc(text)}</p>${btns?`<div class="row">${btns}</div>`:""}</div>${heroArt()}</section>`}
function joinCard(inline){const done=st.me.inTeam;
  return `<div class="role team"><span class="ic soft">${ic("users")}</span><h3>${esc(t("roleTeamT"))}</h3><span class="sub">${esc(t("roleTeamS"))}</span>${done?`<div><span class="pill ok">${esc(t("onTeam"))}${st.me.name?" · "+esc(st.me.name):""}</span></div>`:inline?`<form id="joinForm" class="f" novalidate>${fld("j_name",t("memberName"),inp("j_name",st.me.name||(st.authUser&&st.authUser.displayName)||"","text",'required autocomplete="name"'),t("memberHint"),true)}<div><button class="btn primary" type="submit">${ic("plus")}${esc(t("joinBtn"))}</button></div></form>`:`<div><button class="btn primary" type="button" data-act="joinTeam">${ic("plus")}${esc(t("roleTeamBtn"))}</button></div>`}</div>`}
function welcomePage(){const nm=st.me.name||(st.authUser&&st.authUser.displayName)||"";
  return heroBlock(t("welcomeT")+(nm?(lang==="fa"?"،":","):""),t("welcomeS"),`<button class="btn outline-w" type="button" data-act="demo">${ic("eye")}${esc(t("seeDemo"))}</button>`,"photo-duo.jpg",nm)+
  `<section class="sec"><div class="roles">${joinCard(true)}<div class="role"><span class="ic alt">${ic("clock")}</span><h3>${esc(t("waitT"))}</h3><span class="sub">${esc(t("waitS"))}</span><div><button class="btn" type="button" data-act="reload">${esc(t("reload"))}</button></div></div></div></section>`}
async function saveJoin(name){name=String(name||"").trim().replace(/\s+/g," ");if(!name)return false;const uid=st.me.id,now=new Date().toISOString();
  try{const b=st.db.batch();b.set(st.db.collection("team").doc(uid),{name,createdAt:now,by:uid,self:true},{merge:true});b.set(st.db.collection("users").doc(uid),{name,inTeam:true},{merge:true});await b.commit();st.me.name=name;st.me.inTeam=true;render();toast(t("saved"));return true}catch(err){toast(t("joinErr"));return false}}
function landing(canStart){const others=Object.keys(st.pms).length;
  return heroBlock(t("heroA"),t("heroS"),`${canStart?`<button class="btn white" type="button" data-act="startPm">${ic("plus")}${esc(t("rolePmBtn"))}</button>`:""}<button class="btn outline-w" type="button" data-act="demo">${ic("eye")}${esc(t("seeDemo"))}</button>`,"photo-team.jpg",t("heroB"))+`
  <section class="sec"><div class="sec-h"><h2>${ic("spark")}${esc(t("howT"))}</h2></div><div class="steps">
   ${[["folder","step1"],["list","step2"],["chain","step3"],["chart","step4"]].map(([i,k],n)=>`<div class="step"><span class="n">${fmtNum(n+1)}</span><span class="ic">${ic(i)}</span><h3>${esc(t(k+"T"))}</h3><span class="sub">${esc(t(k+"S"))}</span></div>`).join("")}
  </div></section>

   ${canStart?`<div class="role main"><span class="ic">${ic("user")}</span><h3>${esc(t("rolePmT"))}</h3><span class="sub">${esc(t("rolePmS"))}</span><div><button class="btn primary" type="button" data-act="startPm">${ic("plus")}${esc(t("rolePmBtn"))}</button></div></div>`:""}
   <div class="role"><span class="ic alt">${ic("eye")}</span><h3>${esc(t("roleSupT"))}</h3><span class="sub">${esc(t("roleSupS"))}</span>${others?"":`<span class="pill plain">${esc(t("roleSupNote"))}</span>`}</div>
   ${st.authUser&&!st.demo?joinCard(false):`<div class="role team"><span class="ic soft">${ic("users")}</span><h3>${esc(t("roleTeamT"))}</h3><span class="sub">${esc(t("roleTeamS"))}</span></div>`}
  </div></section>`:""}`}

function home(){const me=st.me.id,isPm=me&&st.pms[me];const all=Object.keys(st.pms);
  if(!isPm&&!all.length)return landing(!st.readOnly&&!!me);
  let h="";
  if(isPm){const p=st.pms[me];const others=all.filter(u=>u!==me);
    h+=`<div class="greet banner"><div class="bn-txt"><div class="row" style="flex:1;min-width:0">${av(p.name,"lg")}<div><h1>${esc(t("hello"))}${lang==="fa"?"، ":", "}${esc(p.name)}</h1><div class="sub">${esc(t("helloS"))}</div></div></div>${canEditPm(me)?`<button class="btn primary" type="button" data-act="newProject" data-uid="${esc(me)}">${ic("plus")}${esc(t("newProject"))}</button>`:""}</div><img class="bn-img" src="photo-work.jpg" alt="${esc(t("teamPhoto"))}"></div>`;
    h+=`<div class="sec">${statTiles(totals([me]))}</div>`;
    h+=`<section class="sec"><div class="sec-h"><h2>${ic("folder")}${esc(t("myProjects"))}</h2></div>${projectCards(me)}</section>`;
    h+=`<section class="sec"><div class="sec-h"><h2>${ic("clock")}${esc(t("activity"))}</h2></div>${feed([me])}</section>`;
    if(others.length&&(st.me.owner||st.me.admin))h+=`<section class="sec"><div class="sec-h"><h2>${ic("users")}${esc(t("managers"))}</h2></div>${pmGrid(others)}</section>`;
    return h}
  h+=`<div class="greet banner"><div class="bn-txt"><div style="flex:1;min-width:0"><h1>${esc(t("managers"))}</h1><div class="sub">${esc(t("helloSup"))}</div></div>${!isPm&&!st.readOnly&&me?`<button class="btn primary" type="button" data-act="startPm">${ic("plus")}${esc(t("startPm"))}</button>`:isPm&&canEditPm(me)?`<button class="btn primary" type="button" data-act="newProject" data-uid="${esc(me)}">${ic("plus")}${esc(t("newProject"))}</button>`:""}</div><img class="bn-img" src="photo-duo.jpg" alt="${esc(t("teamPhoto"))}"></div>`;
  h+=`<div class="sec">${statTiles(totals(all))}</div>`;
  h+=`<section class="sec"><div class="sec-h"><h2>${ic("users")}${esc(t("managers"))}</h2></div>${pmGrid(all)}</section>`;
  h+=`<section class="sec"><div class="sec-h"><h2>${ic("clock")}${esc(t("activity"))}</h2></div>${feed(all)}</section>`;
  return h}
function pmGrid(list){const me=st.me.id;return `<div class="grid">${list.map(u=>{const p=st.pms[u],projs=Object.values(st.projects[u]||{});const tt=totals([u]);
    return `<button class="card" type="button" data-act="openPm" data-uid="${esc(u)}"><div class="row">${av(p.name,"lg")}<div><div class="t">${esc(p.name||"—")}${u===me?` <span class="pill plain">${lang==="fa"?"شما":"you"}</span>`:""}</div><div class="sub">${esc(p.role||"")}</div></div></div>
    <div class="kv"><span>${esc(t("projects"))} <b>${fmtNum(projs.length)}</b></span><span>${esc(t("stOpen"))} <b>${fmtNum(tt.o)}</b></span>${tt.l?`<span style="color:var(--brand)">${esc(t("stLate"))} <b style="color:var(--brand)">${fmtNum(tt.l)}</b></span>`:""}</div>
    <div class="chips">${projs.slice(0,4).map(x=>pill(PST[x.status||"active"],x.name)).join("")}</div></button>`}).join("")}</div>`}

function projectCards(uid){const projs=Object.entries(st.projects[uid]||{}).sort((a,b)=>String(b[1].updatedAt||"").localeCompare(a[1].updatedAt||""));
  if(!projs.length)return emptyBox("folder",t("noProjectsT"),uid===st.me.id?t("noProjectsMine"):t("noProjects"),canEditPm(uid)?`<button class="btn primary" type="button" data-act="newProject" data-uid="${esc(uid)}">${ic("plus")}${esc(t("newProject"))}</button>`:"");
  return `<div class="grid">${projs.map(([pid,p])=>{const s=p.summary||{};const pct=s.tasks?Math.round(100*s.done/s.tasks):0;
    return `<button class="card project" type="button" data-act="openProject" data-uid="${esc(uid)}" data-pid="${esc(pid)}">
      <div class="row between"><span class="ref">${esc(p.code||"")}</span>${pill(PST[p.status||"active"],t("pst."+(p.status||"active")))}</div>
      <div><div class="t">${esc(p.name)}</div>${p.client?`<div class="sub">${esc(p.client)}</div>`:""}</div>
      <div class="bar" role="img" aria-label="${pct}%"><span style="width:${pct}%"></span></div>
      <div class="kv"><span><b>${fmtNum(s.done||0)}</b> ${esc(t("of"))} <b>${fmtNum(s.tasks||0)}</b> ${esc(t("tasksDone"))}</span><span>${ic("flag")} <b>${esc(fmtDate(p.due))}</b></span>${s.overdue?`<span style="color:var(--brand)">${esc(t("stLate"))} <b style="color:var(--brand)">${fmtNum(s.overdue)}</b></span>`:""}</div></button>`}).join("")}</div>`}

function pmPage(uid){const p=st.pms[uid]||{};
  return crumbs([{act:"home",label:t("home")},{label:p.name||"—"}])+

function projectPage(uid,pid){const p=(st.projects[uid]||{})[pid];if(!p)return crumbs([{act:"home",label:t("home")},{label:"…"}])+`<div class="empty">${esc(t("loading"))}</div>`;
  const tab=st.view.tab||"tasks",ed=canEditPm(uid);const s=projectStats(st.tasks);const pct=s.tasks?Math.round(100*s.done/s.tasks):0;
  let h=crumbs([{act:"home",label:t("home")},{act:"openPm",data:`data-uid="${esc(uid)}"`,label:pmName(uid)},{label:p.name}]);
  h+=`<div class="phead"><div class="row between"><div class="stack" style="gap:4px"><span class="ref">${esc(p.code||"")}</span><h1>${esc(p.name)}</h1></div>${ed?`<button class="btn" type="button" data-act="editProject">${ic("edit")}${esc(t("edit"))}</button>`:""}</div>
   <div class="row">${pill(PST[p.status||"active"],t("pst."+(p.status||"active")))}${p.client?`<span class="sub">${ic("user")} ${esc(p.client)}</span>`:""}<span class="sub">${esc(fmtDate(p.start))} – ${esc(fmtDate(p.due))}</span></div>
   <div class="row" style="gap:12px"><div class="bar" style="flex:1;min-width:120px"><span style="width:${pct}%"></span></div><span class="sub num">${fmtNum(s.done)}/${fmtNum(s.tasks)} ${esc(t("tasksDone"))}</span></div></div>`;
  h+=`<div class="tabs" role="tablist">${[["tasks","list"],["journal","book"],["report","chart"],["about","info"]].map(([k,i])=>`<button type="button" role="tab" aria-selected="${tab===k}" data-act="tab" data-tab="${k}">${ic(i)}${esc(t(k))}</button>`).join("")}</div>`;
  if(tab==="tasks")h+=tasksTab(uid,pid,ed);else if(tab==="journal")h+=journalTab(uid,pid,ed);else if(tab==="report")h+=reportTab(uid,pid,p);else h+=aboutTab(p,uid,pid);
  return h}

function aboutTab(p,uid,pid){transSrc["goal:"+pid]=p.goal;
  return `<div class="stack"><div class="panel stack"><h3>${esc(t("goal"))}</h3><div class="report">${esc(p.goal||"–")}</div>${trBtn("goal:"+pid,p.goal)}</div>
  <div class="panel stack"><h3>${esc(t("team"))}</h3><div class="row">${(p.team||[]).map(n=>`<span class="row" style="gap:6px">${av(n)}<b>${esc(n)}</b></span>`).join("")||"–"}</div></div>

function delBlock(kind,id,ed){if(!ed)return"";

function stageBlock(s,i,tid,ed){const key="stage:"+tid+":"+s.id;transSrc[key]=s.report;const dd=dayDiff(s.start,s.end);

  <div class="kv"><span>${ic("clock")} ${esc(fmtDate(s.start))} – ${esc(fmtDate(s.end))}</span>${dd!=null?`<span><b>${fmtNum(dd)}</b> ${esc(t("days"))}</span>`:""}${s.hours?`<span><b>${fmtNum(s.hours)}</b> ${esc(t("h"))}</span>`:""}</div>

  ${links.length||(s.files||[]).length?`<div class="chips">${links.map(l=>/^https?:\/\//i.test(l)?`<a class="chip" href="${esc(l)}" target="_blank" rel="noopener">${ic("link")}${esc(l.replace(/^https?:\/\//,"").slice(0,48))}</a>`:`<span class="chip">${esc(l)}</span>`).join("")}${(s.files||[]).map(f=>`<a class="chip" href="/_blob/${esc(f.id)}" target="_blank" rel="noopener">${ic("clip")}${esc(f.name)}</a>`).join("")}</div>`:""}
  </div></div>`}

function journalTab(uid,pid,ed){const arr=Object.entries(st.logs).sort((a,b)=>String(b[1].date+(b[1].createdAt||"")).localeCompare(a[1].date+(a[1].createdAt||"")));

    return `<div class="log"><div class="d">${esc(fmtDate(l.date))}</div><div class="stack" style="gap:6px;min-width:0"><div class="row between">${pill(cls,t("lk."+k))}${ed?`<div class="row"><button class="btn small ghost" type="button" data-act="editLog" data-lid="${esc(lid)}">${ic("edit")}</button>${st.confirm==="log:"+lid?`<button class="btn small danger" type="button" data-act="doDelete" data-kind="log" data-id="${esc(lid)}">${esc(t("yes"))}</button><button class="btn small" type="button" data-act="cancelDel">${esc(t("cancel"))}</button>`:`<button class="btn small ghost danger" type="button" data-act="askDelete" data-kind="log" data-id="${esc(lid)}">${esc(t("del"))}</button>`}</div>`:""}</div><div class="report">${esc(l.text)}</div>${trBtn(key,l.text)}</div></div>`}).join("")}</div>`}

/* ---------- report ---------- */
function buildReport(){const tasks=Object.values(st.tasks);const s=projectStats(st.tasks);const people={};
  tasks.forEach(x=>(x.stages||[]).forEach(g=>{const n=g.who||"–";const r=people[n]||(people[n]={stages:0,done:0,returned:0,hours:0,days:0,dn:0});r.stages++;if(g.status==="done")r.done++;if(g.status==="returned")r.returned++;r.hours+=Number(g.hours)||0;const d=dayDiff(g.start,g.end);if(d!=null){r.days+=d;r.dn++}}));
  const overdue=tasks.filter(x=>x.due&&x.status!=="done"&&x.due<today());
  const cutoff=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  const recent=Object.values(st.logs).filter(l=>(l.date||"")>=cutoff).sort((a,b)=>String(b.date).localeCompare(a.date));
  const issues=Object.values(st.logs).filter(l=>l.kind==="issue").length;
  return{s,people,overdue,recent,issues}}
function reportTab(uid,pid,p){const r=buildReport();const pct=r.s.tasks?Math.round(100*r.s.done/r.s.tasks):0;
  let h=`<div class="sec-h" style="margin-bottom:14px"><h2>${ic("chart")}${esc(t("summary"))}</h2><div class="row"><button class="btn small" type="button" data-act="copyReport">${esc(t("copyReport"))}</button>${!st.demo?`<button class="btn small" type="button" data-act="exportCsv">${esc(t("exportCsv"))}</button>`:""}</div></div>`;
  h+=`<div class="stats" style="margin-bottom:18px"><div class="stat"><span class="n">${fmtNum(pct)}%</span><span class="l">${esc(t("progress"))} · ${fmtNum(r.s.done)}/${fmtNum(r.s.tasks)}</span></div><div class="stat"><span class="n">${fmtNum(r.s.active)}</span><span class="l">${esc(t("activeStages"))}</span></div><div class="stat"><span class="n">${fmtNum(r.s.hours)}</span><span class="l">${esc(t("hoursCol"))}</span></div><div class="stat ${r.issues?"hot":""}"><span class="n">${fmtNum(r.issues)}</span><span class="l">${esc(t("openIssues"))}</span></div></div>`;
  const ppl=Object.entries(r.people).sort((a,b)=>b[1].stages-a[1].stages);
  h+=`<div class="panel stack" style="margin-bottom:14px"><h3>${esc(t("byPerson"))}</h3>${ppl.length?`<div style="overflow-x:auto"><table><thead><tr><th>${esc(t("person"))}</th><th>${esc(t("stagesCol"))}</th><th>${esc(t("doneCol"))}</th><th>${esc(t("returnedCol"))}</th><th>${esc(t("hoursCol"))}</th><th>${esc(t("avgDays"))}</th></tr></thead><tbody>${ppl.map(([n,x])=>`<tr><td><span class="row" style="gap:8px">${av(n)}<b>${esc(n)}</b></span></td><td class="num">${fmtNum(x.stages)}</td><td class="num">${fmtNum(x.done)}</td><td class="num" style="${x.returned?"color:var(--brand);font-weight:700":""}">${fmtNum(x.returned)}</td><td class="num">${fmtNum(x.hours)}</td><td class="num">${x.dn?fmtNum((x.days/x.dn).toFixed(1)):"–"}</td></tr>`).join("")}</tbody></table></div>`:`<span class="sub">${esc(t("none"))}</span>`}</div>`;
  h+=`<div class="panel stack" style="margin-bottom:14px"><h3>${esc(t("overdue"))}</h3>${r.overdue.length?`<ul class="subs">${r.overdue.map(x=>`<li><span class="ref">${code(x.num)}</span><span>${esc(x.title)} · <b style="color:var(--brand)">${esc(fmtDate(x.due))}</b></span></li>`).join("")}</ul>`:`<span class="sub">${esc(t("none"))}</span>`}</div>`;
  h+=`<div class="panel stack"><h3>${esc(t("recent"))}</h3>${r.recent.length?r.recent.map(l=>`<div class="stack" style="gap:2px"><div class="row"><span class="sub">${esc(fmtDate(l.date))}</span>${pill("",t("lk."+(l.kind||"daily")))}</div><div class="report">${esc(l.text)}</div></div>`).join(""):`<span class="sub">${esc(t("none"))}</span>`}</div>`;
  return h}
function reportText(uid,pid){const p=(st.projects[uid]||{})[pid]||{};const r=buildReport();const L=[];
  L.push(`${p.code||""} ${p.name||""}`.trim());L.push(`${t("status")}: ${t("pst."+(p.status||"active"))} · ${t("start")} ${p.start||"–"} · ${t("due")} ${p.due||"–"}`);if(p.client)L.push(`${t("client")}: ${p.client}`);
  L.push("");L.push(`${t("tasksDone")}: ${r.s.done}/${r.s.tasks} · ${t("activeStages")}: ${r.s.active} · ${t("hoursCol")}: ${r.s.hours}`);
  L.push("");Object.values(st.tasks).sort((a,b)=>(a.num||0)-(b.num||0)).forEach(x=>{L.push(`${code(x.num)} ${x.title} [${t("tst."+(x.status||"todo"))}]`);(x.stages||[]).forEach((g,i)=>{L.push(`  ${i+1}. ${g.who||"–"} · ${stageKind(g)} · ${t("sst."+(g.status||"waiting"))} · ${g.start||"–"} → ${g.end||"–"}${g.hours?" · "+g.hours+" "+t("h"):""}`);if(g.report)L.push("     "+g.report.replace(/\n/g,"\n     "))})});
  if(r.recent.length){L.push("");L.push(t("recent")+":");r.recent.forEach(l=>L.push(`- ${l.date} [${t("lk."+(l.kind||"daily"))}] ${l.text.replace(/\n/g," ")}`))}
  return L.join("\n")}
function csv(){const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';const rows=[["Task","Title","Task status","Stage #","Stage","Done by","Received from","Handed to","Stage status","Started","Finished","Days","Hours","Report"]];
  Object.values(st.tasks).sort((a,b)=>(a.num||0)-(b.num||0)).forEach(x=>{const sg=x.stages||[];if(!sg.length)rows.push([code(x.num),x.title,x.status,"","","","","","","","","","",""]);
    sg.forEach((g,i)=>rows.push([code(x.num),x.title,x.status,i+1,stageKind(g),g.who,g.from,g.to,g.status,g.start,g.end,dayDiff(g.start,g.end),g.hours,g.report]))});
  return "﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n")}

/* ---------- team ---------- */
async function loadAll(){if(!st.db)return;const out=[];
  try{for(const uid of Object.keys(st.pms)){for(const [pid,p] of Object.entries(st.projects[uid]||{})){const snap=await st.db.collection("pm/"+uid+"/projects/"+pid+"/tasks").get();snap.docs.forEach(d=>out.push({uid,pid,pname:p.name,tid:d.id,task:d.data()}))}}}catch(e){}
  st.all=out;render()}
const normName=n=>String(n||"").trim().toLowerCase().replace(/\s+/g," ");
function teamStats(month){const roster=st.team||{};const byName={};Object.entries(roster).forEach(([id,m])=>byName[normName(m.name)]=id);
  const P={};const get=(key,name)=>P[key]||(P[key]={key,name,listed:!!roster[key],done:0,returned:0,hours:0,days:0,dn:0,tasks:new Set(),items:[]});
  Object.entries(roster).forEach(([id,m])=>get(id,m.name));
  (st.all||[]).forEach(r=>(r.task.stages||[]).forEach(s=>{if(!s.who)return;const mon=(s.end||s.start||"").slice(0,7);if(mon!==month)return;
    const key=(s.whoId&&roster[s.whoId])?s.whoId:(byName[normName(s.who)]||("n:"+normName(s.who)));const p=get(key,roster[key]?roster[key].name:s.who);
    p.tasks.add(r.uid+"/"+r.pid+"/"+r.tid);if(s.status==="done"){p.done++;const d=dayDiff(s.start,s.end);if(d!=null){p.days+=d;p.dn++}}
    if(s.status==="returned"&&(s.returnReason||"quality")==="quality")p.returned++;p.hours+=Number(s.hours)||0;p.items.push({r,s})}));
  return Object.values(P).sort((a,b)=>(b.done+b.returned)-(a.done+a.returned)||a.name.localeCompare(b.name))}
function monthLabel(m){try{return new Date(m+"-15T12:00:00").toLocaleDateString(lang==="fa"?"fa-AF-u-ca-gregory":"en-GB",{month:"long",year:"numeric"})}catch(e){return m}}
function teamPage(){const v=st.view,month=v.month||today().slice(0,7);const canAdd=st.me.role==="pm"||st.me.admin;
  let h=crumbs([{act:"home",label:t("home")},{label:t("teamT")}]);
  h+=`<div class="teamband"><div class="tb-text"><h1>${esc(t("teamT"))}</h1><div class="sub">${esc(t("teamS"))}</div><div class="row" style="margin-top:6px"><label class="fl" for="teamMonth" style="font-weight:600">${esc(t("month"))}<input id="teamMonth" type="month" value="${esc(month)}" style="width:auto;border:1px solid var(--line);border-radius:var(--r-s);padding:7px 10px;background:var(--surface);color:var(--ink)"></label>${canAdd?`<button class="btn primary" type="button" data-act="addMember">${ic("plus")}${esc(t("addMember"))}</button>`:""}<button class="btn" type="button" data-act="teamRefresh">${esc(t("refresh"))}</button></div></div><img src="photo-group.jpg" alt="${esc(t("teamPhoto"))}"></div>`;
  if(!Object.keys(st.team||{}).length&&!(st.all||[]).length)return h+`<div class="sec">${emptyBox("users",t("noTeamT"),t("noTeamS"),canAdd?`<button class="btn primary" type="button" data-act="addMember">${ic("plus")}${esc(t("addMember"))}</button>`:"")}</div>`;
  if(!st.all)return h+`<div class="sec"><div class="empty"><span class="ic">${ic("chart")}</span><b>${esc(t("countingAll"))}</b></div></div>`;
  if(st.me.role==="supervisor"&&!st.me.inTeam)h+=joinBox();
  const stats=teamStats(month);
  if(v.person){const p=stats.find(x=>x.key===v.person);if(p)return h+personDetail(p,month)}
  const tot=stats.reduce((a,p)=>({d:a.d+p.done,r:a.r+p.returned,h:a.h+p.hours}),{d:0,r:0,h:0});
  h+=`<div class="sec stats"><div class="stat"><span class="n">${fmtNum(stats.filter(p=>p.items.length).length)}</span><span class="l">${esc(t("people"))}</span></div><div class="stat"><span class="n">${fmtNum(tot.d)}</span><span class="l">${esc(t("stagesDone"))}</span></div><div class="stat ${tot.r?"hot":""}"><span class="n">${fmtNum(tot.r)}</span><span class="l">${esc(t("sentBack"))}</span></div><div class="stat"><span class="n">${fmtNum(tot.h)}</span><span class="l">${esc(t("hoursM"))}</span></div></div>`;
  h+=`<section class="sec"><div class="sec-h"><h2>${ic("users")}${esc(monthLabel(month))}</h2></div><div class="grid">${stats.map(p=>{const rate=(p.done+p.returned)?Math.round(100*p.returned/(p.done+p.returned)):0;
    return `<button class="card" type="button" data-act="person" data-key="${esc(p.key)}"><div class="row">${av(p.name,"lg")}<div style="min-width:0"><div class="t">${esc(p.name)}</div>${p.listed?"":`<span class="pill warn">${esc(t("unlisted"))}</span>`}</div></div>
    <div class="kv"><span>${esc(t("stagesDone"))} <b>${fmtNum(p.done)}</b></span><span>${esc(t("tasksWorked"))} <b>${fmtNum(p.tasks.size)}</b></span></div>
    <div class="kv"><span ${p.returned?'style="color:var(--brand)"':""}>${esc(t("sentBackRate"))} <b ${p.returned?'style="color:var(--brand)"':""}>${fmtNum(p.returned)}${p.returned?` · ${fmtNum(rate)}%`:""}</b></span><span>${esc(t("hoursM"))} <b>${fmtNum(p.hours)}</b></span>${p.dn?`<span>${esc(t("avgDaysM"))} <b>${fmtNum((p.days/p.dn).toFixed(1))}</b></span>`:""}</div></button>`}).join("")}</div></section>`;
  return h}
function personDetail(p,month){const rate=(p.done+p.returned)?Math.round(100*p.returned/(p.done+p.returned)):0;
  let h=`<div class="sec"><button class="btn small back" type="button" data-act="personBack">${ic("arrow")} ${esc(t("teamT"))}</button></div>`;
  h+=`<div class="sec phead"><div class="row">${av(p.name,"lg")}<div><h1>${esc(p.name)}</h1><div class="sub">${esc(t("workIn"))} ${esc(monthLabel(month))}</div></div></div></div>`;
  h+=`<div class="sec stats"><div class="stat"><span class="n">${fmtNum(p.done)}</span><span class="l">${esc(t("stagesDone"))}</span></div><div class="stat"><span class="n">${fmtNum(p.tasks.size)}</span><span class="l">${esc(t("tasksWorked"))}</span></div><div class="stat ${p.returned?"hot":""}"><span class="n">${fmtNum(p.returned)}</span><span class="l">${esc(t("sentBack"))}${p.returned?` · ${fmtNum(rate)}%`:""}</span></div><div class="stat"><span class="n">${fmtNum(p.hours)}</span><span class="l">${esc(t("hoursM"))}</span></div></div>`;

async function translate(key){const src=transSrc[key];if(!src||!st.sample)return;const cur=st.trans[key];if(cur&&cur.busy)return;
  if(cur&&cur.text){delete st.trans[key];render();return}
  const to=/[؀-ۿ]/.test(src)?"en":"fa";st.trans[key]={busy:true,to};render();
  try{const r=await st.sample(`Translate the following project report text into ${to==="fa"?"Dari Persian (as used in Afghanistan)":"clear English"}. Keep names, numbers, dates, links and technical terms as they are. Reply with only the translation.\n\n${src}`,{modelTier:"quick"});
    st.trans[key]={text:r.text,to}}catch(e){delete st.trans[key];toast(t("tFail"))}render()}

  case"newLog":logForm(v.uid,v.pid);break;
  case"editLog":logForm(v.uid,v.pid,el.dataset.lid);break;
  case"askDelete":st.confirm=el.dataset.kind+":"+el.dataset.id;render();break;
  case"cancelDel":st.confirm=null;render();break;
  case"doDelete":{const k=el.dataset.kind,id=el.dataset.id;const base="pm/"+v.uid+"/projects/"+v.pid;st.confirm=null;
    try{if(k==="log"){await write(base+"/logs/"+id,()=>st.db.doc(base+"/logs/"+id).delete());await touchProject(v.uid,v.pid)}
      else if(k==="task"){await write(base+"/tasks/"+id,()=>st.db.doc(base+"/tasks/"+id).delete());delete st.tasks[id];await touchProject(v.uid,v.pid);go({name:"project",uid:v.uid,pid:v.pid,tab:"tasks"})}
      else if(k==="project"){await Promise.all(Object.keys(st.tasks).map(tid=>write(base+"/tasks/"+tid,()=>st.db.doc(base+"/tasks/"+tid).delete())).concat(Object.keys(st.logs).map(lid=>write(base+"/logs/"+lid,()=>st.db.doc(base+"/logs/"+lid).delete()))));
        await write(base,()=>st.db.doc(base).delete());go({name:"pm",uid:v.uid})}
      toast(t("deleted"))}catch(err){onErr(err)}render();break}
  case"translate":translate(el.dataset.key);break;
  case"copyReport":{const txt=reportText(v.uid,v.pid);try{await navigator.clipboard.writeText(txt);toast(t("copied"))}catch(err){toast(t("copyFail"))}break}
  case"exportCsv":{const p=(st.projects[v.uid]||{})[v.pid]||{};const name=((p.code||"project")+"-"+(p.name||"").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")).slice(0,60)+".csv";
    const url=URL.createObjectURL(new Blob([csv()],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);break}
  case"users":go({name:"users"});break;
  case"team":st.all=null;go({name:"team",month:today().slice(0,7)});loadAll();break;
  case"teamRefresh":st.all=null;render();loadAll();break;
  case"addMember":memberForm();break;
  case"person":st.view=Object.assign({},v,{person:el.dataset.key});render();window.scrollTo(0,0);break;
  case"personBack":st.view=Object.assign({},v,{person:null});render();break;
  case"signOut":fbAuth&&fbAuth.signOut();break;
  case"google":{try{await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(err){if(err&&err.code!=="auth/popup-closed-by-user")toast(t("authErr"))}break}
  case"authMode":st.authMode=st.authMode==="in"?"up":"in";render();break;
  case"closeModal":closeModal();break;
  }});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.innerHTML)closeModal();
  if(e.key==="Enter"&&e.target.matches("tr.click"))e.target.click()});
boot();
})();
</script>
